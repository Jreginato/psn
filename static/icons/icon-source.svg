<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f151c"/>
      <stop offset="100%" style="stop-color:#1a2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#2b7cff"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Barra decorativa superior -->
  <rect x="0" y="0" width="512" height="6" rx="3" fill="url(#accent)"/>

  <!-- Letras JR -->
  <text
    x="256"
    y="320"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="240"
    font-weight="900"
    text-anchor="middle"
    fill="url(#accent)"
    letter-spacing="-10"
  >JR</text>

  <!-- Linha decorativa abaixo das letras -->
  <rect x="106" y="355" width="300" height="5" rx="2.5" fill="url(#accent)" opacity="0.5"/>

  <!-- Subtexto -->
  <text
    x="256"
    y="415"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="600"
    text-anchor="middle"
    fill="#45d1a8"
    letter-spacing="6"
  >PERSONAL</text>
</svg>
